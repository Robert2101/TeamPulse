name: Redis keep-alive

# Upstash free-tier databases are shut down after a period of inactivity.
# This pings the database on a schedule, independent of whether the backend host is awake.
on:
  schedule:
    - cron: "23 */8 * * *" # every 8 hours, off the top of the hour to avoid GitHub's busiest minutes
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write # lets the last step keep this schedule from being auto-disabled

concurrency:
  group: redis-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ping Upstash Redis
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          KEEPALIVE_SOURCE: github-actions
        run: node backend/scripts/redis-keepalive.js

      # GitHub disables scheduled workflows in public repos after 60 days without repository activity.
      # Re-enabling through the API from inside the run keeps the schedule alive without dummy commits.
      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/redis-keepalive.yml/enable"
